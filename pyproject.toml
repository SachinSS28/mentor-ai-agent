[project]
name = "mentor"
version = "0.1.0"
description = "Mentor: personal AI chief of staff and coach"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastmcp>=4.1.0",
    "feedparser>=6.0.14",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-telegram-bot[job-queue]>=22.8",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
mentor = "mentor.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mentor"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Alembic's template imports op/sa/pgvector up front; keep them even while a migration is empty.
"backend/mentor/db/migrations/versions/*" = ["F401", "E501"]  # generated; CHECK lists run long

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"
packages = ["mentor"]
exclude = ["backend/mentor/db/migrations/"]  # generated code

# Google's client libraries ship without type information.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "feedparser"]
ignore_missing_imports = true

# google-auth's Credentials methods are unannotated; allow calling them only here.
[[tool.mypy.overrides]]
module = ["mentor.mcp_servers.google_tools.auth"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.alembic]
script_location = "%(here)s/backend/mentor/db/migrations"
prepend_sys_path = ["backend"]

# Every new migration is formatted and linted as soon as Alembic writes it.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
