# Which model plays each role (plan D5, D13).
# Until AWS access is ready, every role runs on Gemma 4 E4B via Ollama on the Mac.
# Switching a role to Bedrock (step 0.4) is a change in this file only.
providers:
  ollama:
    base_url: http://127.0.0.1:11434

roles:
  # num_ctx: Gemma 4 E4B handles 128K tokens; 32K fits the instructions, the 6,000-token history
  # window, your saved memories and tool results with room to spare (Ollama's default is 4,096).
  orchestrator: { provider: ollama, model: "gemma4:e4b", temperature: 0.3, num_ctx: 32768 }
  fast: { provider: ollama, model: "gemma4:e4b", temperature: 0, num_ctx: 32768 }
  # Search by meaning in your own documents: EmbeddingGemma (300M), small enough to run beside Gemma.
  embed: { provider: ollama, model: "embeddinggemma", temperature: null }
