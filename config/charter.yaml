# Mentor charter: who Mentor works for and the rules it works by.
# Mentor reads this at startup. Blank values (null / []) still need your answers.

assistant:
  name: Mentor
  language: english            # switches to Hinglish/Hindi when you write that way
  coaching_tone: direct        # warm but honest: flags overcommitment, slips, low-value meetings

owner:
  name: Sachin
  city: Hong Kong
  timezone: Asia/Hong_Kong
  coverage: [hong_kong, mumbai, mainland_china]   # local and travel features
  currency: HKD

working_hours:
  days: []                     # e.g. [mon, tue, wed, thu, fri, sat]
  start: null                  # e.g. "10:00"
  end: null                    # e.g. "19:00"
  deep_work: null              # your best focus window, e.g. "09:30-12:00"

daily_rhythm:                  # 24-hour times, Hong Kong time
  morning_checkin: "06:30"
  morning_brief: "07:00"
  midday_check: "13:00"
  shutdown: "18:30"
  evening_review: "21:30"
  weekly_review: { day: sun, time: "19:00" }
  quiet_hours: { start: "22:30", end: "06:30" }

# One workspace per business or client group; Mentor never mixes their details.
workspaces: []
#  - id: example
#    name: Example Business
#    about: One line on what it does

# Goals for Oct-Dec 2026. Each one gets a measurable target where possible.
goals: []
#  - title: Close new clients
#    workspace: example
#    target: "5 by 31 Dec"

routines: []
#  - name: exercise
#    schedule: "mon-sat 06:45"
#    target: "30 min"

# Areas only, never exact addresses.
places: []
#  - label: home
#    area: Central
#    usual_mode: mtr              # car | mtr | bus | cab
#    buffer_minutes: 15

# Job Desk: jobs from your LinkedIn job-alert emails, ranked against your profile.
job_search:
  focus:
    - Water and environmental engineering (integrated water management, hydraulics, wastewater, utilities)
    - Academic and research positions (professor, lecturer, researcher)
    - Engineering and sustainability consulting or advisory
    - Anything else that fits the CV well
  locations: [Hong Kong]
  digest_time: "08:00"         # daily shortlist on Telegram, Hong Kong time
  min_score: 50                # fit 0-100; lower-scoring jobs stay out of the digest
  digest_size: 8
  follow_up_days: 7            # reminder this many days after you apply

budget:
  monthly_cap_hkd: 500         # all-in: AWS + AI models (about US$64)
  alert_at: [0.5, 0.8, 1.0]
  at_cap: downgrade_to_cheapest_model_and_block_non_essential

approvals:
  expire_after_minutes: 120
  # T0 auto: read-only (calendar, email, search, weather, PNR, travel time)
  # T1 auto + notify: reversible changes in your own space (tasks, tentative holds, notes, expenses)
  # T2 one-tap approval: anything others see or that costs money (send, invite, book, pay, delete)
  # T3 never: bank transfers, sharing ID documents, changing passwords, bulk deletes
  new_recipient_always_ask: true
